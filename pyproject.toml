[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "igogs"
version = "0.1.2"
description = "Driver caméra pour goban physique : jouer sur OGS, enregistrer, analyser avec Go Sensei"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python-headless", "websocket-client", "dbus-fast; sys_platform == 'linux'"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
igogs = "igogs.__main__:main"

[tool.setuptools]
packages = ["igogs", "igogs.static"]

[tool.setuptools.package-data]
"igogs.static" = ["*"]
