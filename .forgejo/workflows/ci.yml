name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: docker
    strategy:
      matrix:
        python: ['3.10', '3.13']   # oldest supported + current
    container:
      image: python:${{ matrix.python }}-bookworm
    steps:
      - name: Checkout
        run: |
          git clone "${{ github.server_url }}/${{ github.repository }}.git" .
          git checkout -q "${{ github.sha }}"

      - name: Install
        run: pip install --quiet ".[dev]"

      - name: Tests (goban simulé, sans caméra ni réseau)
        run: python -m pytest -q tests
