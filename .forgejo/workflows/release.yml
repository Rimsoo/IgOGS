# Construit l'AppImage et le paquet Python, et les joint à la release Forgejo du tag.
#   * push d'un tag "vX.Y.Z"  -> construction, puis création / mise à jour de la release
#   * lancement manuel        -> construction + vérifications seulement (rien de publié)
# Le tag doit correspondre à la version de pyproject.toml.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  appimage:
    name: AppImage
    runs-on: docker
    container:
      image: python:3.12-bookworm
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'   # pas de FUSE dans les conteneurs
    steps:
      - name: Checkout
        run: |
          git clone "${{ github.server_url }}/${{ github.repository }}.git" .
          git checkout -q "${{ github.sha }}"

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF#refs/tags/v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag v$tag does not match pyproject.toml version $version" >&2
            exit 1
          fi

      - name: Tests
        run: pip install --quiet ".[dev]" && python -m pytest -q tests

      - name: Build AppImage and Python package
        run: |
          apt-get update && apt-get install -y --no-install-recommends file jq
          ./build-appimage.sh
          pip install --quiet build && python -m build --outdir dist .
          mv ./*.AppImage dist/
          ls -la dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          auth=(-H "Authorization: token $TOKEN")
          # Garde les notes écrites à la main d'une release existante ; sinon la crée.
          id=$(curl -fsS "${auth[@]}" "$API/releases/tags/$TAG" | jq -r .id || true)
          if [ -z "$id" ] || [ "$id" = null ]; then
            id=$(jq -n --arg t "$TAG" --arg n "IgOGS $TAG" '{tag_name: $t, name: $n}' \
                 | curl -fsS -X POST "${auth[@]}" -H "Content-Type: application/json" \
                     -d @- "$API/releases" | jq -r .id)
          fi
          for f in dist/*.AppImage dist/*.whl dist/*.tar.gz; do
            name=$(basename "$f")
            old=$(curl -fsS "${auth[@]}" "$API/releases/$id/assets" \
                  | jq -r --arg n "$name" '.[] | select(.name == $n) | .id')
            [ -n "$old" ] && curl -fsS -X DELETE "${auth[@]}" "$API/releases/$id/assets/$old"
            curl -fsS -X POST "${auth[@]}" -F "attachment=@$f" \
                 "$API/releases/$id/assets?name=$name" >/dev/null
            echo "Uploaded $name to release $TAG"
          done
